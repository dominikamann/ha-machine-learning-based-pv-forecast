name: Feature request
description: Suggest an idea, a new sensor or a model improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the use case, not only the solution.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
  - type: textarea
    id: evidence
    attributes:
      label: Data or backtest results
      description: |
        Model changes go in when the backtest (`tools/backtest.py`) or the live error sensors show
        that they help. Numbers from your plant are very welcome.
